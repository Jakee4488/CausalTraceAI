[pytest]
# Confine collection to tests/. Without this a bare `pytest` from the repo root
# also collects any root-level test_*.py — a scratch script once lived there and
# executed its module body on import. CI always passed an explicit path, so this
# only ever bit people running pytest locally.
testpaths = tests

# Put the repo root on sys.path so `import src...` / `import proxy...` resolve.
# Inherited-by-accident behaviour otherwise: `python -m pytest` adds the CWD and
# works, while a bare `pytest` or `uv run pytest` does not and every test errors
# with ModuleNotFoundError. Declaring it makes the suite invocation-independent.
pythonpath = .

filterwarnings =
    ignore::DeprecationWarning
markers =
    logged_out: run a UI test without a session, to exercise the access gate itself
